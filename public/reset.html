<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset PIN — MyBaoFamily</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: linear-gradient(135deg, #6C63FF, #4B44CC); }
    .card { background: white; border-radius: 24px; padding: 40px; text-align: center;
            max-width: 340px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    h1 { font-size: 1.4rem; color: #1f2937; margin: 12px 0 6px; }
    p  { color: #6b7280; font-size: 0.9rem; margin: 0 0 24px; }
    .pin { font-size: 2.5rem; font-weight: bold; color: #6C63FF; letter-spacing: 8px; margin: 16px 0; }
    .btn { display: inline-block; background: #6C63FF; color: white; border: none;
           padding: 14px 32px; border-radius: 14px; font-size: 1rem; font-weight: 600;
           cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: #4B44CC; }
    .ok { color: #10b981; font-size: 1.1rem; font-weight: 600; margin: 16px 0; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem">🔐</div>
    <h1>Reset & Khôi phục</h1>
    <p>Chọn thao tác bạn cần:</p>
    <p class="ok" id="ok"></p>
    <button class="btn" onclick="doReset()">Reset PIN về 1234</button>
    <div style="height:12px"></div>
    <button class="btn" style="background:#ef4444" onclick="clearCache()">Xóa cache ảnh (sửa lỗi quota)</button>
    <div style="height:12px"></div>
    <button class="btn" style="background:#6b7280" onclick="nukeAll()">Xóa toàn bộ dữ liệu local</button>
    <p style="font-size:0.75rem;color:#9ca3af;margin-top:16px">
      Dữ liệu gia đình (thành viên, gia phả, ảnh) vẫn an toàn trên Supabase và sẽ tự đồng bộ lại sau khi đăng nhập.
    </p>
  </div>

  <script>
    function showOk(msg) {
      var el = document.getElementById('ok')
      el.textContent = msg
      el.style.display = 'block'
      setTimeout(function() { window.location.href = '/' }, 1500)
    }

    function doReset() {
      try {
        var raw = localStorage.getItem('family-hub-v1') || '{}'
        var d = JSON.parse(raw)
        if (!d.state) d.state = {}
        d.state.pin = '1234'
        d.state.isAuthenticated = false
        d.version = 1
        localStorage.setItem('family-hub-v1', JSON.stringify(d))
        showOk('✅ Đã reset PIN về 1234')
      } catch(e) {
        localStorage.removeItem('family-hub-v1')
        showOk('✅ Đã reset')
      }
    }

    // Strip the heavy base64 fields (photos, member avatars, ancestor photos)
    // from localStorage. They live on Supabase and re-hydrate on next sync.
    // Use this when iOS Safari shows "quota exceeded" errors.
    function clearCache() {
      try {
        var raw = localStorage.getItem('family-hub-v1')
        if (!raw) { showOk('✅ Không có cache cần xóa'); return }
        var d = JSON.parse(raw)
        if (d && d.state) {
          d.state.photos = []
          if (Array.isArray(d.state.members)) {
            d.state.members = d.state.members.map(function(m) {
              var c = Object.assign({}, m); delete c.avatarUrl; return c
            })
          }
          if (Array.isArray(d.state.ancestors)) {
            d.state.ancestors = d.state.ancestors.map(function(a) {
              var c = Object.assign({}, a); delete c.photoUrl; return c
            })
          }
        }
        localStorage.setItem('family-hub-v1', JSON.stringify(d))
        showOk('✅ Đã xóa cache ảnh — đồng bộ lại sẽ tự tải về')
      } catch(e) {
        localStorage.removeItem('family-hub-v1')
        showOk('✅ Đã xóa toàn bộ — đăng nhập lại để đồng bộ')
      }
    }

    function nukeAll() {
      if (!confirm('Xóa TOÀN BỘ dữ liệu local? (Server không bị ảnh hưởng)')) return
      try { localStorage.clear() } catch(e) {}
      showOk('✅ Đã xóa hết — đăng nhập lại')
    }
  </script>
</body>
</html>
